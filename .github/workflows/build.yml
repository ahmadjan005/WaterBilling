name: Build APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip latest uploaded zip
        run: |
          ZIP="$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)"
          echo "Using: $ZIP"
          unzip -o "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: cd WaterBilling && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WaterBilling-APK
          path: WaterBilling/app/build/outputs/apk/debug/app-debug.apk
